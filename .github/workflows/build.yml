name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        shell: cmd
        run: |
          mkdir bin
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize+ /target:winexe /out:bin\ClaudeKey.exe src\ClaudeKey.cs

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeKey
          path: bin/ClaudeKey.exe
